{% extends 'base.html' %}
{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="product-container">
    <h1>{{ product.name }}</h1>
    
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 300px;">
    {% endif %}

    <p>{{ product.description }}</p>
    <p><strong>قیمت: {{ product.price }} تومان</strong></p>
    <p>فروشگاه: {{ product.store.name }}</p>

    <a href="{% url 'marketplace:add_to_cart' product.id %}" class="btn">Add to Cart</a>
</div>
{% endblock %}
