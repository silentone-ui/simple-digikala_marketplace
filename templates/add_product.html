{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>افزودن محصول جدید به {{ store.name }}</h2>
    <hr>

    {% if form.errors %}
        <div class="alert alert-danger">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary mt-3">ثبت محصول</button>
    </form>
</div>
{% endblock %}
